name: Weekly Historical Metrics Update

on:
  schedule:
    - cron: '30 1 * * 6'   # Every Saturday 07:00 IST
  workflow_dispatch:

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICE_ACCOUNT_JSON is missing or empty in GitHub Secrets!"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/service_account.json

      - name: Validate required secrets
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          SHEET_ID_MIDCAP: ${{ secrets.SHEET_ID_MIDCAP }}
          SHEET_ID_RANGE: ${{ secrets.SHEET_ID_RANGE }}
          SHEET_ID_SMALLCAP: ${{ secrets.SHEET_ID_SMALLCAP }}
        run: |
          echo "Checking required GitHub Secrets..."
          ERRORS=0
          if [ -z "$DHAN_CLIENT_ID" ]; then
            echo "::error::Secret DHAN_CLIENT_ID is missing or empty in GitHub Secrets!"
            ERRORS=1
          fi
          if [ -z "$DHAN_ACCESS_TOKEN" ]; then
            echo "::error::Secret DHAN_ACCESS_TOKEN is missing or empty in GitHub Secrets!"
            ERRORS=1
          fi
          if [ -z "$SHEET_ID_MIDCAP" ] && [ -z "$SHEET_ID_RANGE" ] && [ -z "$SHEET_ID_SMALLCAP" ]; then
            echo "::error::At least one spreadsheet ID (SHEET_ID_MIDCAP, SHEET_ID_RANGE, or SHEET_ID_SMALLCAP) must be set in GitHub Secrets!"
            ERRORS=1
          fi
          if [ "$ERRORS" -eq 1 ]; then
            exit 1
          fi
          echo "Required secrets validated successfully."


      - name: Debug files
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "ROOT FILES"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "DATA DIRECTORY"
          echo "========================================"
          ls -la data

          echo ""
          echo "========================================"
          echo "CHECKING EXCEL FILE"
          echo "========================================"

          if test -f data/symbols.xlsx; then
            echo "FOUND: data/symbols.xlsx"
            ls -lh data/symbols.xlsx
          else
            echo "NOT FOUND: data/symbols.xlsx"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "CHECKING PYTHON FILES"
          echo "========================================"
          ls -lh main_historical.py
          ls -lh config.py

      - name: Run historical update
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          SHEET_ID_MIDCAP: ${{ secrets.SHEET_ID_MIDCAP }}
          SHEET_ID_RANGE: ${{ secrets.SHEET_ID_RANGE }}
          SHEET_ID_SMALLCAP: ${{ secrets.SHEET_ID_SMALLCAP }}
          GOOGLE_CREDENTIALS_FILE: credentials/service_account.json
        run: python main_historical.py
