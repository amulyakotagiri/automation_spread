name: Weekly Historical Metrics Update

on:
  schedule:
    - cron: '30 1 * * 6'   # Every Saturday 07:00 IST
  workflow_dispatch:

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service_account.json
      - name: Run historical update
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          SHEET_ID_MIDCAP: ${{ secrets.SHEET_ID_MIDCAP }}
          SHEET_ID_RANGE: ${{ secrets.SHEET_ID_RANGE }}
          SHEET_ID_SMALLCAP: ${{ secrets.SHEET_ID_SMALLCAP }}
          GOOGLE_CREDENTIALS_FILE: credentials/service_account.json
        run: python main_historical.py